<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tag Configurator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Tag Configurator</h1>
    <p class="subtitle">PLC export &rarr; universal machine signals &rarr; machine_config.json</p>
  </header>

  <main class="app-main">
    <section class="panel import-panel panel-full">
      <h2>1. Import</h2>
      <div class="import-grid">
        <div>
          <span class="field">Source File</span>
          <div class="dropzone">
            <input type="file" id="file-input" accept=".l5k,.csv" />
          </div>
          <p id="import-status" class="status-text"></p>
        </div>
        <div>
          <label class="field">
            Append existing machine_config.json (optional)
            <input type="file" id="config-file-input" accept=".json" />
          </label>

          <label class="field">
            Machine name
            <input type="text" id="machine-name" placeholder="Machine_001" />
          </label>
          <label class="field">
            PLC IP
            <input type="text" id="plc-ip" placeholder="192.168.1.10" class="mono" />
          </label>
        </div>
      </div>
    </section>

    <section class="panel saved-panel panel-full">
      <h2>2. Saved machines in this config</h2>
      <div id="saved-machines" class="tag-list"></div>
    </section>

    <section class="panel mapping-panel">
      <h2>3. Map signals</h2>
      <datalist id="tag-options-list"></datalist>
      <div id="mapping-list" class="mapping-list"></div>

      <h3 class="subsection-title">Custom signals</h3>
      <div id="custom-signal-list" class="mapping-list custom-signal-list"></div>
      <button id="add-signal-btn" class="secondary" type="button">+ Add signal</button>
    </section>

    <section class="panel tags-panel">
      <h2>4. Tags</h2>
      <input type="search" id="tag-search" placeholder="Search tags..." />
      <div id="tag-list" class="tag-list"></div>
    </section>

    <section class="panel validation-panel panel-full">
      <h2>5. Validate &amp; export</h2>
      <ul id="validation-errors" class="validation-errors"></ul>
      <button id="save-machine-btn" disabled>Save machine</button>
      <button id="cancel-edit-btn" type="button" class="secondary" hidden>Cancel edit</button>
      <div class="export-actions">
        <button id="export-btn" disabled>Download machine_config.json</button>
        <button id="clear-btn" class="secondary">Clear draft</button>
      </div>
    </section>
  </main>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
